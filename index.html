<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="ZUBSTUDIO — timeless clothing, elevated silhouettes and refined everyday pieces."
    />

    <meta name="theme-color" content="#f6f2e9" />

    <title>ZUBSTUDIO</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Italiana&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="./favicon.jpeg" />
  </head>

  <body>
    <!-- =========================
       ANNOUNCEMENT BAR
  ========================== -->

    <div class="announcement">
      <p>THE NEW COLLECTION — NOW AVAILABLE</p>
    </div>

    <!-- =========================
       HEADER
  ========================== -->

    <header class="site-header">
      <a href="#/home" class="brand" aria-label="ZUBSTUDIO home">
        <img src="./favicon.jpeg" alt="" class="brand-icon" />

        <span class="brand-name"> ZUBSTUDIO </span>
      </a>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="#/home">Home</a>

        <a href="#/shop">Shop</a>

        <a href="#/new"> New Arrivals </a>

        <a href="#/about">Our Story</a>
      </nav>

      <div class="header-actions">
        <button
          class="header-icon search-toggle"
          type="button"
          aria-label="Search"
        >
          <i class="bx bx-search"></i>
        </button>
        <a
          class="header-icon instagram-header"
          href="https://www.instagram.com/zubstudio_by_subi?stkn=MTl5YXB6Z2t5M2RsNA=="
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Follow ZUBSTUDIO on Instagram"
        >
          <i class="bx bxl-instagram"></i>
        </a>

        <a
          class="header-icon cart-button"
          href="#/cart"
          aria-label="Shopping bag"
        >
          <i class="bx bx-shopping-bag"></i>

          <span class="cart-count" id="cart-count"> 0 </span>
        </a>

        <button
          class="header-icon mobile-menu-toggle"
          id="mobile-menu-toggle"
          type="button"
          aria-label="Open menu"
        >
          <i class="bx bx-menu"></i>
        </button>
      </div>

      <!-- MOBILE NAV -->

      <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation">
        <a href="#/home">Home</a>

        <a href="#/shop">Shop All</a>

        <a href="#/new"> New Arrivals </a>

        <a href="#/about">Our Story</a>
      </nav>
    </header>

    <!-- =========================
       SEARCH OVERLAY
  ========================== -->

    <div class="search-overlay" id="search-overlay" aria-hidden="true">
      <div class="search-panel">
        <button
          class="search-close"
          id="search-close"
          type="button"
          aria-label="Close search"
        >
          <i class="bx bx-x"></i>
        </button>

        <p class="search-label">SEARCH ZUBSTUDIO</p>

        <div class="search-input-wrap">
          <input
            type="search"
            id="global-search"
            placeholder="What are you looking for?"
            autocomplete="off"
          />

          <i class="bx bx-search"></i>
        </div>

        <div class="search-results" id="search-results"></div>
      </div>
    </div>

    <!-- =========================
       MAIN APP
  ========================== -->

    <main id="app"></main>

    <!-- =========================
       TOAST
  ========================== -->

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
  </body>
</html>
